apiVersion: apps/v1
kind: Deployment
metadata:
  name: codenote
  namespace: codenote
  labels:
    app: codenote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codenote
  template:
    metadata:
      labels:
        app: codenote
    spec:
      containers:
        - name: codenote
          image: codenote:latest
          ports:
            - containerPort: 8000
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codenote-secrets
                  key: anthropic-api-key
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codenote-secrets
                  key: github-token
            - name: NOTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codenote-secrets
                  key: notion-api-key
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
